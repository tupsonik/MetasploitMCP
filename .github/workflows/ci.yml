name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Syntax check
        run: python -m compileall -q MetasploitMCP.py config.py security.py msf_client.py tools
      - name: Run tests
        env:
          MSF_PASSWORD: test-password
        run: python -m pytest tests/ --cov=MetasploitMCP --cov-report=term-missing
